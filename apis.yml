aid: stoke-talent
name: Stoke Talent
description: >-
  Stoke Talent is a Freelance Management System (FMS) that lets enterprises source, onboard,
  manage, and pay external freelancers and contractors in one place while handling worker
  classification, contracts, tax, legal, and compliance. Founded in Israel and backed by Battery
  Ventures, Stoke was acquired by Fiverr in November 2021 for roughly $95M and subsequently
  rebranded as Fiverr Enterprise, now offered under the Fiverr Pro / Fiverr Enterprise product
  line. As of this enrichment pass the company publishes no public developer API, API reference,
  SDKs, or webhook documentation; this profile is maintained for network completeness.
